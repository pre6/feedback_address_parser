# Start the app:        docker compose up --build
# Run a training cycle: docker compose --profile train run --rm trainer
#   (quick check:       docker compose --profile train run --rm trainer python trainer/retrain.py --subset 20000 --api-url http://api:8000)
# Batch-parse a table:  docker compose run --rm api python api/batch_parse.py --source-table addresses --id-col id --text-col location --dry-run --limit 500

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-addresses}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # lets you connect from DBeaver/psql on your machine; remove if not needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-addresses}}
      MODELS_DIR: /app/models
      CORRECTIONS_DIR: /app/data/corrections
    volumes:
      - ./models:/app/models:ro                    # the API only reads models
      - ./data/corrections:/app/data/corrections   # the API appends analyst corrections here
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    profiles: ["train"]          # not started by `docker compose up`; run it on demand
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    mem_limit: 12g               # a training run can't starve the API; lower this if your machine has less RAM
    cpus: 4

volumes:
  pgdata:
